        .glass { 
            background: rgba(255, 255, 255, 0.03);

        .glass-card:hover {

            border: 1px solid rgba(59, 130, 246, 0.4);
            transform: scale(1.02);
        }
        .big-gradient-text { 
            background: linear-gradient(to right, #ffffff, #94a3b8); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        .glow-effect {
            position: absolute;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            z-index: -1;
            filter: blur(50px);
        }
        /* Resim için özel parıltı */

            box-shadow: 0 0 50px rgba(59, 130, 246, 0.2);
        }
        /* Skip to content */
        .skip-link {
            position: absolute;
            left: -9999px;
            top: auto;
            width: 1px;
            height: 1px;
            overflow: hidden;
        }
        .skip-link:focus {
            position: fixed;
            left: 1rem;
            top: 1rem;
            width: auto;
            height: auto;
            padding: 0.5rem 1rem;
            background: #3b82f6;
            color: #fff;
            font-weight: bold;
            border-radius: 0.375rem;
            z-index: 9999;
            outline: 2px solid #fff;
        }
        /* Focus ring for interactive elements */
        a:focus-visible, button:focus-visible {
            outline: 2px solid #3b82f6;
            outline-offset: 3px;
        }
    </style>

<body class="overflow-x-hidden">

    <!-- Skip to main content -->
    <a href="#main-content" class="skip-link">Ana içeriğe geç</a>

    <div class="glow-effect" style="top: -10%; left: -10%;"></div>
    <div class="glow-effect" style="bottom: 10%; right: -10%;"></div>

    <nav aria-label="Ana navigasyon" class="fixed w-full z-50 bg-[#030508]/90 border-b border-white/10 py-6 px-8 md:px-16 flex justify-between items-center backdrop-blur-xl">
        <div class="text-2xl font-extrabold tracking-tighter text-white">BI - NER<span class="text-blue-500">.</span></div>
        <!-- Desktop nav -->
        <div class="hidden md:flex space-x-10 text-sm font-bold uppercase tracking-widest">
            <a href="#about" class="hover:text-blue-400 transition">Hakkımda</a>
            <a href="#projects" class="hover:text-blue-400 transition">Projeler</a>
            <a href="https://github.com/kadirbiner" target="_blank" rel="noopener noreferrer" class="bg-blue-600 hover:bg-blue-700 px-6 py-3 rounded-full text-white transition-all transform hover:scale-105">GitHub Profil</a>

        <!-- Mobile hamburger button -->
        <button id="nav-toggle" type="button"
            aria-expanded="false"
            aria-controls="mobile-menu"
            class="md:hidden text-white focus:outline-none p-2 rounded-lg"

        </button>
    </nav>

    <!-- Mobile menu -->
    <div id="mobile-menu" class="hidden fixed top-0 left-0 w-full h-full z-40 bg-[#030508]/95 backdrop-blur-xl flex-col items-center justify-center space-y-10 text-2xl font-bold uppercase tracking-widest md:hidden">
        <button id="mobile-close" type="button" aria-label="Menüyü kapat" class="absolute top-6 right-8 text-white text-3xl focus:outline-none">
            <i class="fas fa-times" aria-hidden="true"></i>
        </button>
        <a href="#about" class="hover:text-blue-400 transition text-white" id="mobile-about">Hakkımda</a>
        <a href="#projects" class="hover:text-blue-400 transition text-white" id="mobile-projects">Projeler</a>
        <a href="https://github.com/kadirbiner" target="_blank" rel="noopener noreferrer" class="bg-blue-600 hover:bg-blue-700 px-8 py-4 rounded-full text-white transition-all">GitHub Profil</a>

    <main id="main-content" tabindex="-1">

    <section id="about" class="min-h-screen flex flex-col md:flex-row justify-center items-center px-8 md:px-24 pt-20 gap-12">

                Karmaşık problemleri basit kodlarla çözmeyi ve sistemleri otomatize etmeyi seviyorum.
            </p>
            
            <div class="flex flex-wrap gap-8 text-4xl text-gray-600">
                <i class="fab fa-python hover:text-[#3776AB] transition-colors cursor-help" title="Python"></i>
                <i class="fab fa-docker hover:text-[#2496ED] transition-colors cursor-help" title="Docker"></i>
                <i class="fab fa-js hover:text-[#F7DF1E] transition-colors cursor-help" title="JavaScript"></i>
                <i class="fab fa-linux hover:text-white transition-colors cursor-help" title="Linux"></i>
                <i class="fas fa-microchip hover:text-green-500 transition-colors cursor-help" title="IoT"></i>

        <div class="relative group">

            <div class="relative w-64 h-64 md:w-80 md:h-80 rounded-full overflow-hidden border-2 border-white/10 profile-glow">
                <img src="./profil-3.jpg" alt="Abdulkadir Biner" width="320" height="320" loading="lazy" class="w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-500">

        </div>

    <section id="projects" class="py-32 px-8 md:px-24">

        </div>
        
        <div id="repo-container" class="grid md:grid-cols-2 gap-10">
            <div class="col-span-full flex justify-center py-20">

    <footer class="py-20 text-center border-t border-white/10 bg-[#020305]">

            <a href="https://www.linkedin.com/in/abdulkadir-biner-666561251/" class="text-gray-500 hover:text-white transition"><i class="fab fa-linkedin"></i></a>

    <script>
        // Mobile navigation toggle
        const navToggle = document.getElementById('nav-toggle');
        const mobileMenu = document.getElementById('mobile-menu');
        const mobileClose = document.getElementById('mobile-close');

        function openMenu() {
            mobileMenu.classList.remove('hidden');
            mobileMenu.classList.add('flex');
            navToggle.setAttribute('aria-expanded', 'true');
            mobileClose.focus();
        }

        function closeMenu() {
            mobileMenu.classList.add('hidden');
            mobileMenu.classList.remove('flex');
            navToggle.setAttribute('aria-expanded', 'false');
            navToggle.focus();
        }

        navToggle.addEventListener('click', openMenu);
        mobileClose.addEventListener('click', closeMenu);

        // Close menu when a link is clicked
        ['mobile-about', 'mobile-projects'].forEach(id => {
            document.getElementById(id).addEventListener('click', closeMenu);
        });

        // Close on Escape key
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && !mobileMenu.classList.contains('hidden')) {
                closeMenu();
            }
        });

        // GitHub repos fetch
        async function fetchGitHubRepos() {
            const username = 'kadirbiner';
            const container = document.getElementById('repo-container');

            try {
                const response = await fetch(`https://api.github.com/users/${username}/repos?sort=updated&per_page=30`);

                if (!response.ok) {
                    if (response.status === 403) {
                        const rateLimitRemaining = response.headers.get('X-RateLimit-Remaining');
                        if (rateLimitRemaining === '0') {
                            container.innerHTML = '<p class="col-span-full text-yellow-400 text-center text-xl py-10">GitHub API istek limiti aşıldı. Lütfen birkaç dakika sonra tekrar deneyin.</p>';
                            return;
                        }
                    }
                    throw new Error(`HTTP ${response.status}`);
                }

                const repos = await response.json();

                const filtered = repos.filter(repo => !repo.fork && repo.name !== `${username}.github.io`).slice(0, 6);

                if (filtered.length === 0) {
                    container.innerHTML = '<p class="col-span-full text-gray-400 text-center text-xl py-10">Henüz gösterilecek proje yok.</p>';
                    return;
                }

                container.innerHTML = '';
                let html = '';
                filtered.forEach(repo => {
                    html += `
                        <div class="glass glass-card p-10 rounded-3xl transition-all duration-300 flex flex-col h-full">
                            <div class="flex justify-between items-start mb-8">
                                <i class="fas fa-code text-4xl text-blue-500"></i>
                                <div class="flex items-center gap-4 text-sm font-bold text-gray-500">
                                    <span>⭐ ${repo.stargazers_count}</span>
                                    <span>🍴 ${repo.forks_count}</span>
                                </div>
                            </div>
                            <h3 class="text-2xl md:text-3xl font-bold text-white mb-4">
                                ${repo.name.replace(/-/g, ' ')}
                            </h3>
                            <p class="text-lg text-gray-400 mb-8 flex-grow leading-relaxed">
                                ${repo.description ? repo.description : 'Yapay zeka ve yazılım geliştirme üzerine detaylı bir çalışma.'}
                            </p>
                            <div class="flex items-center justify-between mt-auto">
                                <span class="px-4 py-2 bg-blue-500/20 text-blue-400 rounded-lg text-sm font-bold uppercase">
                                    ${repo.language ? repo.language : 'DevOps'}
                                </span>
                                <a href="${repo.html_url}" target="_blank" rel="noopener noreferrer" class="text-white hover:text-blue-500 transition text-lg font-bold flex items-center gap-2">
                                    İncele <i class="fas fa-arrow-right"></i>
                                </a>
                            </div>
                        </div>
                    `;
                });
                container.innerHTML = html;
            } catch (error) {
                container.innerHTML = '<p class="col-span-full text-red-400 text-center text-xl py-10">Projeler yüklenemedi. Lütfen internet bağlantınızı kontrol edin ve sayfayı yenileyin.</p>';
            }
        }
        fetchGitHubRepos();
    </script>
