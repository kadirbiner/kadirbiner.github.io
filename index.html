<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kadir Biner | Software Engineer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #030508; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #e2e8f0;
        }
        .glass { 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(16px); 
            border: 1px solid rgba(255, 255, 255, 0.1); 
        }
        .glass-card:hover {
            background: rgba(59, 130, 246, 0.05);
            border: 1px solid rgba(59, 130, 246, 0.4);
            transform: scale(1.02);
        }
        .big-gradient-text { 
            background: linear-gradient(to right, #ffffff, #94a3b8); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
        }
        .glow-effect {
            position: absolute;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, transparent 70%);
            border-radius: 50%;
            z-index: -1;
            filter: blur(50px);
        }
        /* Resim için özel parıltı */
        .profile-glow {
            box-shadow: 0 0 50px rgba(59, 130, 246, 0.2);
        }
    </style>
</head>
<body class="overflow-x-hidden">

    <div class="glow-effect" style="top: -10%; left: -10%;"></div>
    <div class="glow-effect" style="bottom: 10%; right: -10%;"></div>

    <nav class="fixed w-full z-50 bg-[#030508]/90 border-b border-white/10 py-6 px-8 md:px-16 flex justify-between items-center backdrop-blur-xl">
        <div class="text-2xl font-extrabold tracking-tighter text-white">BI - NER<span class="text-blue-500">.</span></div>
        <div class="hidden md:flex space-x-10 text-sm font-bold uppercase tracking-widest">
            <a href="#about" class="hover:text-blue-400 transition">Hakkımda</a>
            <a href="#projects" class="hover:text-blue-400 transition">Projeler</a>
            <a href="https://github.com/kadirbiner" target="_blank" class="bg-blue-600 hover:bg-blue-700 px-6 py-3 rounded-full text-white transition-all transform hover:scale-105">GitHub Profil</a>
        </div>
    </nav>

    <section id="about" class="min-h-screen flex flex-col md:flex-row justify-center items-center px-8 md:px-24 pt-20 gap-12">
        <div class="flex-1">
            <h2 class="text-blue-500 font-mono text-xl mb-6 tracking-widest uppercase font-bold">Merhaba, ben</h2>
            <h1 class="text-6xl md:text-8xl font-extrabold text-white mb-8 tracking-tighter big-gradient-text">
                Abdulkadir Biner
            </h1>
            <p class="text-xl md:text-3xl text-gray-400 max-w-4xl leading-relaxed mb-12">
                <span class="text-white">Computer Engineer</span> & <span class="text-white text-blue-400">AI Enthusiast</span>. <br>
                Karmaşık problemleri basit kodlarla çözmeyi ve sistemleri otomatize etmeyi seviyorum.
            </p>
            
            <div class="flex flex-wrap gap-8 text-4xl text-gray-600">
                <i class="fab fa-python hover:text-[#3776AB] transition-colors cursor-help" title="Python"></i>
                <i class="fab fa-docker hover:text-[#2496ED] transition-colors cursor-help" title="Docker"></i>
                <i class="fab fa-js hover:text-[#F7DF1E] transition-colors cursor-help" title="JavaScript"></i>
                <i class="fab fa-linux hover:text-white transition-colors cursor-help" title="Linux"></i>
                <i class="fas fa-microchip hover:text-green-500 transition-colors cursor-help" title="IoT"></i>
            </div>
        </div>

        <div class="relative group">
            <div class="absolute -inset-1 bg-gradient-to-r from-blue-600 to-purple-600 rounded-full blur opacity-25 group-hover:opacity-50 transition duration-1000"></div>
            <div class="relative w-64 h-64 md:w-80 md:h-80 rounded-full overflow-hidden border-2 border-white/10 profile-glow">
                <img src="../profil-3.jpg" alt="Abdulkadir Biner" class="w-full h-full object-cover grayscale hover:grayscale-0 transition-all duration-500">
            </div>
        </div>
    </section>

    <section id="projects" class="py-32 px-8 md:px-24">
        <div class="mb-20">
            <h2 class="text-5xl md:text-7xl font-bold text-white mb-6 tracking-tighter">Projelerim</h2>
            <div class="h-2 w-32 bg-blue-600 rounded-full"></div>
        </div>
        
        <div id="repo-container" class="grid md:grid-cols-2 gap-10">
            <div class="col-span-full flex justify-center py-20">
                <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-blue-500"></div>
            </div>
        </div>
    </section>

    <footer class="py-20 text-center border-t border-white/10 bg-[#020305]">
        <div class="flex justify-center space-x-8 mb-10 text-3xl">
            <a href="https://www.linkedin.com/in/abdulkadir-biner-666561251/" class="text-gray-500 hover:text-white transition"><i class="fab fa-linkedin"></i></a>
            <a href="https://github.com/kadirbiner" class="text-gray-500 hover:text-white transition"><i class="fab fa-github"></i></a>
        </div>
        <p class="text-lg font-medium text-gray-600">
            &copy; 2026 Tüm hakları saklıdır.
        </p>
    </footer>

    <script>
        async function fetchGitHubRepos() {
            const username = 'kadirbiner';
            const container = document.getElementById('repo-container');
            
            try {
                const response = await fetch(`https://api.github.com/users/${username}/repos?sort=updated&per_page=6`);
                const repos = await response.json();
                container.innerHTML = ''; 

                repos.forEach(repo => {
                    if (!repo.fork && repo.name !== `${username}.github.io`) {
                        const card = `
                            <div class="glass glass-card p-10 rounded-3xl transition-all duration-300 flex flex-col h-full">
                                <div class="flex justify-between items-start mb-8">
                                    <i class="fas fa-code text-4xl text-blue-500"></i>
                                    <div class="flex items-center gap-4 text-sm font-bold text-gray-500">
                                        <span>⭐ ${repo.stargazers_count}</span>
                                        <span>🍴 ${repo.forks_count}</span>
                                    </div>
                                </div>
                                <h3 class="text-2xl md:text-3xl font-bold text-white mb-4">
                                    ${repo.name.replace(/-/g, ' ')}
                                </h3>
                                <p class="text-lg text-gray-400 mb-8 flex-grow leading-relaxed">
                                    ${repo.description ? repo.description : 'Yapay zeka ve yazılım geliştirme üzerine detaylı bir çalışma.'}
                                </p>
                                <div class="flex items-center justify-between mt-auto">
                                    <span class="px-4 py-2 bg-blue-500/20 text-blue-400 rounded-lg text-sm font-bold uppercase">
                                        ${repo.language ? repo.language : 'DevOps'}
                                    </span>
                                    <a href="${repo.html_url}" target="_blank" class="text-white hover:text-blue-500 transition text-lg font-bold flex items-center gap-2">
                                        İncele <i class="fas fa-arrow-right"></i>
                                    </a>
                                </div>
                            </div>
                        `;
                        container.innerHTML += card;
                    }
                });
            } catch (error) {
                container.innerHTML = '<p class="text-red-400 text-center text-xl">Veriler yüklenemedi.</p>';
            }
        }
        fetchGitHubRepos();
    </script>
</body>
</html>
